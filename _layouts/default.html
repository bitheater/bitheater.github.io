<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.short_description | default: site.description | strip_html | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.short_description | default: site.description | strip_html | escape }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/syntax.css' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/logo.png' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="BitHeater engineering archive home"><img class="brand-logo" src="{{ '/assets/logo.png' | relative_url }}" alt="BitHeater" width="419" height="379"><span>Engineering archive</span></a>
    <nav aria-label="Main navigation"><a href="https://www.bitheater.co.uk/#services">Consulting</a><a href="https://www.bitheater.co.uk/#products">Products</a><a href="https://www.linkedin.com/company/bitheater/">LinkedIn</a><a href="mailto:info@bitheater.co.uk">Contact</a></nav>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="wrap site-footer"><div><strong>BitHeater</strong><p>Software consulting, automation and products in development.</p></div><p><a href="https://www.bitheater.co.uk/">Main website</a><br><a href="mailto:info@bitheater.co.uk">info@bitheater.co.uk</a></p></footer>
</body>
</html>
